<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Chart Arrow Element (Growth indicator) -->
  <path d="M 120 360 L 220 260 L 300 320 L 400 160" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 330 160 H 400 V 230" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Main Monogram/Icon Badge "LK" / Lightning Flow -->
  <g filter="url(#glow)">
    <!-- Shield / Hexagon Shape -->
    <path d="M 256 96 L 392 174 V 338 L 256 416 L 120 338 V 174 Z" fill="url(#primaryGrad)" fill-opacity="0.9" stroke="#ffffff" stroke-width="6" stroke-opacity="0.2"/>
    
    <!-- Flow Pulse Inner Vector -->
    <path d="M 200 190 H 260 L 230 256 H 300 L 220 330 L 240 270 H 190 Z" fill="#ffffff"/>
  </g>

  <!-- Bright Apex Node -->
  <circle cx="400" cy="160" r="16" fill="#38bdf8"/>
</svg>
